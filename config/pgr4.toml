# XenonRecomp config for Project Gotham Racing 4 (4D5307F9), default.xex with Title Update #2.
# Paths are relative to this file.
[main]
file_path = "../game/default.xex"
patch_file_path = "../out/tu2/default.xexp"
patched_file_path = "../out/tu2/default_tu2.xex"
out_directory_path = "../out/ppc"
switch_table_file_path = "pgr4_switch_tables.toml"

skip_lr = false
skip_msr = false
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
cr_as_local = true
non_argument_as_local = false
non_volatile_as_local = false

# Register save/restore helpers (tools/findhelpers.py on the patched image; one match each).
restgprlr_14_address = 0x828D7D50
savegprlr_14_address = 0x828D7D00
restfpr_14_address = 0x828D86BC
savefpr_14_address = 0x828D8670
restvmx_14_address = 0x828D89A8
savevmx_14_address = 0x828D8710
restvmx_64_address = 0x828D8A3C
savevmx_64_address = 0x828D87A4

# CRT setjmp/longjmp, mapped to host setjmp/longjmp with the guest context saved and restored around
# them. Found by matching FM2's copies (setjmp differs only in the address its first instruction loads).
setjmp_address = 0x828DE260
longjmp_address = 0x828DE7E0

