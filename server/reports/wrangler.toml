name = "pgr4-reports"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
# The private repo reports are filed in ("owner/name").
REPORTS_REPO = "zer0ducksgiven/pgr4-reports"

# 10 reports a minute per address (bug reports and logs together).
[[ratelimits]]
name = "LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
